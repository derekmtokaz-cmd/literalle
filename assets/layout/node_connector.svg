<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" fill="none">
  <title>Ornate Metallic Brass Ivy Connector</title>
  <desc>A transparent SVG node connector: ornate ivy-vine filigree rendered as polished aged brass.</desc>

  <defs>
    <linearGradient id="mainMetal" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b1d07"/>
      <stop offset="0.08" stop-color="#8a551b"/>
      <stop offset="0.16" stop-color="#f7d77a"/>
      <stop offset="0.23" stop-color="#fff3b8"/>
      <stop offset="0.30" stop-color="#b47425"/>
      <stop offset="0.42" stop-color="#5b2b0a"/>
      <stop offset="0.54" stop-color="#e0aa43"/>
      <stop offset="0.62" stop-color="#fff0a3"/>
      <stop offset="0.72" stop-color="#a76520"/>
      <stop offset="0.84" stop-color="#efc15b"/>
      <stop offset="1" stop-color="#4a2408"/>
    </linearGradient>

    <radialGradient id="leafMetal" cx="35%" cy="25%" r="82%">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.22" stop-color="#e8b756"/>
      <stop offset="0.52" stop-color="#845016"/>
      <stop offset="0.76" stop-color="#2d1304"/>
      <stop offset="1" stop-color="#d29b3c"/>
    </radialGradient>

    <radialGradient id="gemGlow" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#fff6cb"/>
      <stop offset="0.35" stop-color="#d7a23b"/>
      <stop offset="0.72" stop-color="#743b0c"/>
      <stop offset="1" stop-color="#1d0b02"/>
    </radialGradient>

    <filter id="castShadow" x="-10%" y="-70%" width="120%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="warmBloom" x="-15%" y="-90%" width="130%" height="280%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.95
                0 1 0 0 0.55
                0 0 1 0 0.12
                0 0 0 0.62 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="engravedTexture" x="-20%" y="-90%" width="140%" height="280%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="ivyLeaf" d="M0,-20
      C13,-21 29,-12 34,3
      C24,16 7,16 0,-20 Z" />

    <path id="smallLeaf" d="M0,-12
      C9,-12 18,-6 21,3
      C13,11 4,10 0,-12 Z" />
  </defs>

  <g filter="url(#castShadow)">
    <!-- blackened recess under the metal -->
    <path d="M24 75 C88 24 150 98 214 56 C283 12 347 101 414 58 C487 11 551 103 628 57 C658 39 683 47 700 60"
          stroke="#120703" stroke-width="18" stroke-linecap="round" opacity=".68"/>

    <!-- broad aged brass body -->
    <path d="M24 70 C88 19 150 93 214 51 C283 7 347 96 414 53 C487 6 551 98 628 52 C658 34 683 42 700 55"
          stroke="url(#mainMetal)" stroke-width="12" stroke-linecap="round" filter="url(#warmBloom)"/>

    <!-- raised central ridge -->
    <path d="M30 66 C91 25 151 85 213 47 C282 13 345 87 412 49 C484 13 550 88 626 48 C657 35 680 41 694 53"
          stroke="#fff1a6" stroke-width="3.2" stroke-linecap="round" opacity=".86"/>

    <!-- dark lower bevel -->
    <path d="M27 76 C88 32 151 101 216 59 C284 19 348 104 417 61 C489 18 552 106 630 60 C660 43 683 51 698 63"
          stroke="#2b1104" stroke-width="4.4" stroke-linecap="round" opacity=".78"/>

    <!-- fine engraved hairlines -->
    <g stroke="#6f3b10" stroke-width="1.4" stroke-linecap="round" opacity=".7" filter="url(#engravedTexture)">
      <path d="M52 65 C101 37 151 78 202 52"/>
      <path d="M244 48 C292 25 338 76 391 53"/>
      <path d="M444 50 C494 25 546 78 606 53"/>
    </g>

    <!-- ornate filigree curls -->
    <g stroke="url(#mainMetal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#warmBloom)">
      <path d="M108 43 C92 16 60 20 58 48 C57 70 89 69 89 50 C89 38 73 40 76 51"/>
      <path d="M164 78 C144 112 104 101 111 72 C116 52 145 56 139 75 C135 88 119 83 124 72"/>
      <path d="M305 39 C287 8 249 15 250 47 C251 72 286 69 284 48 C283 35 264 37 269 50"/>
      <path d="M379 78 C360 112 318 101 326 72 C332 50 361 57 354 77 C349 91 331 84 338 71"/>
      <path d="M525 38 C507 8 469 15 470 47 C471 72 506 69 504 48 C503 35 484 37 489 50"/>
      <path d="M586 77 C568 110 531 100 537 73 C542 53 570 57 565 75 C561 88 544 84 550 72"/>
    </g>

    <!-- thinner bright inner filigree ridge -->
    <g stroke="#ffe9a0" stroke-width="1.5" stroke-linecap="round" opacity=".72">
      <path d="M108 43 C92 16 60 20 58 48 C57 70 89 69 89 50"/>
      <path d="M164 78 C144 112 104 101 111 72 C116 52 145 56 139 75"/>
      <path d="M305 39 C287 8 249 15 250 47 C251 72 286 69 284 48"/>
      <path d="M379 78 C360 112 318 101 326 72 C332 50 361 57 354 77"/>
      <path d="M525 38 C507 8 469 15 470 47 C471 72 506 69 504 48"/>
      <path d="M586 77 C568 110 531 100 537 73 C542 53 570 57 565 75"/>
    </g>

    <!-- sculpted leaves -->
    <g filter="url(#warmBloom)">
      <g transform="translate(88 46) rotate(-36) scale(.82)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>
      <g transform="translate(145 83) rotate(143) scale(.76)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>
      <g transform="translate(273 43) rotate(-26) scale(.78)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>
      <g transform="translate(356 85) rotate(147) scale(.8)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>
      <g transform="translate(493 43) rotate(-30) scale(.82)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>
      <g transform="translate(568 82) rotate(139) scale(.72)">
        <use href="#ivyLeaf" fill="url(#leafMetal)" stroke="#ffe08b" stroke-width="1.7"/>
        <path d="M1 -16 C9 -8 19 -2 31 2 M8 -7 C12 -10 15 -13 19 -17 M14 -3 C18 -5 23 -7 29 -8" stroke="#fff0a9" stroke-width="1.1" opacity=".75"/>
      </g>

      <!-- tiny secondary leaves -->
      <g transform="translate(199 47) rotate(36) scale(.65)">
        <use href="#smallLeaf" fill="url(#leafMetal)" stroke="#f7d77a" stroke-width="1.3"/>
      </g>
      <g transform="translate(426 53) rotate(-146) scale(.65)">
        <use href="#smallLeaf" fill="url(#leafMetal)" stroke="#f7d77a" stroke-width="1.3"/>
      </g>
      <g transform="translate(631 50) rotate(42) scale(.62)">
        <use href="#smallLeaf" fill="url(#leafMetal)" stroke="#f7d77a" stroke-width="1.3"/>
      </g>
    </g>

    <!-- jewel-like brass rivets -->
    <g filter="url(#warmBloom)">
      <circle cx="24" cy="70" r="8" fill="url(#gemGlow)" stroke="#ffeb9a" stroke-width="1.8"/>
      <circle cx="214" cy="51" r="5.8" fill="url(#gemGlow)" stroke="#ffeb9a" stroke-width="1.5"/>
      <circle cx="414" cy="53" r="5.8" fill="url(#gemGlow)" stroke="#ffeb9a" stroke-width="1.5"/>
      <circle cx="700" cy="55" r="8" fill="url(#gemGlow)" stroke="#ffeb9a" stroke-width="1.8"/>
      <circle cx="107" cy="43" r="3.8" fill="#fff0a5" opacity=".88"/>
      <circle cx="305" cy="39" r="3.8" fill="#fff0a5" opacity=".88"/>
      <circle cx="525" cy="38" r="3.8" fill="#fff0a5" opacity=".88"/>
    </g>
  </g>
</svg>
